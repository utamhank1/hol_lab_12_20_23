          - locationName: WORK
            nodeName: WRK_claims
          - locationName: WORK
            nodeName: WRK_customers
          - locationName: WORK
            nodeName: WRK_policies
        join:
          joinCondition: |-
            FROM {{ ref('WORK', 'WRK_claims') }} "WRK_claims"
            -- 1. Get the policy details for this claim
            INNER JOIN {{ ref('WORK', 'WRK_policies') }} "WRK_policies"
                ON "WRK_claims"."policy_id" = "WRK_policies"."policy_id"

            -- 2. Get the customer details for this claim
            INNER JOIN {{ ref('WORK', 'WRK_customers') }} "WRK_customers"
                ON "WRK_claims"."customer_id" = "WRK_customers"."customer_id"

            -- 3. Get the Adjuster assigned to this specific claim
            LEFT JOIN {{ ref('WORK', 'WRK_adjusters') }} "WRK_adjusters"
                ON "WRK_claims"."adjuster_id" = "WRK_adjusters"."adjuster_id"

            -- 4. Get the total payments made for this specific claim
            LEFT JOIN {{ ref('WORK', 'SUM_CLAIM_PAYMENTS') }} "SUM_CLAIM_PAYMENTS"
                ON "WRK_claims"."claim_id" = "SUM_CLAIM_PAYMENTS"."claim_id"
