    appliedNodeTests:
      - continueOnFailure: true
        description: ""
        name: Accuracy - Extended price plausibility.
        runOrder: After
        templateString: |
          -- FAIL if extendedprice is implausibly small vs quantity
          select
            t.*
          from {{ this }} t
          where t.LINEITEM_QUANTITY > 0
            and t.LINEITEM_EXTENDEDPRICE < (t.LINEITEM_QUANTITY * 0.01)
      - continueOnFailure: true
        description: ""
        name: Accuracy - Discounted price sanity.
        runOrder: After
        templateString: |-
          -- FAIL if discount produces negative net or net exceeds gross
          select
            t.*,
            (t.LINEITEM_EXTENDEDPRICE * (1 - t.LINEITEM_DISCOUNT)) as NET_EXTENDEDPRICE
          from {{ this }} t
          where t.LINEITEM_EXTENDEDPRICE < 0
             or t.LINEITEM_DISCOUNT < 0
             or (t.LINEITEM_EXTENDEDPRICE * (1 - t.LINEITEM_DISCOUNT)) < 0
             or (t.LINEITEM_EXTENDEDPRICE * (1 - t.LINEITEM_DISCOUNT)) > t.LINEITEM_EXTENDEDPRICE
      - continueOnFailure: true
        description: ""
        name: Accuracy - Date ordering realism.
        runOrder: After
        templateString: |
          -- FAIL if dates violate typical order flow
          select
            t.*
          from {{ this }} t
          where (t.LINEITEM_COMMITDATE is not null and t.LINEITEM_SHIPDATE is not null and t.LINEITEM_COMMITDATE > t.LINEITEM_SHIPDATE)
             or (t.LINEITEM_SHIPDATE is not null and t.LINEITEM_RECEIPTDATE is not null and t.LINEITEM_SHIPDATE > t.LINEITEM_RECEIPTDATE)
      - continueOnFailure: true
        description: ""
        name: Completeness -  Not-null “business keys” (fact grain)
        runOrder: After
        templateString: |
          -- FAIL if key fields are missing
          select t.*
          from {{ this }} t
          where t.LINEITEM_ORDERKEY is null
             or t.LINEITEM_LINENUMBER is null
             or t.LINEITEM_PARTKEY is null
             or t.LINEITEM_SUPPKEY is null
             or t.ORDER_CUSTKEY is null
      - continueOnFailure: true
        description: ""
        name: Completeness - Not-null core measures
        runOrder: After
        templateString: |
          -- FAIL if measures required for analytics are missing
          select t.*
          from {{ this }} t
          where t.LINEITEM_QUANTITY is null
             or t.LINEITEM_EXTENDEDPRICE is null
             or t.LINEITEM_DISCOUNT is null
             or t.LINEITEM_TAX is null
      - continueOnFailure: true
        description: ""
        name: Completeness - Not-null PartSupp fields
        runOrder: After
        templateString: |
          -- FAIL if PartSupp enrichment fields are missing
          select t.*
          from {{ this }} t
          where t.PS_AVAILQTY is null
             or t.PS_SUPPLYCOST is null
      - continueOnFailure: true
        description: ""
        name: Integrity - Referential fact → customer dimension
        runOrder: After
        templateString: |-
          select
            t.ORDER_CUSTKEY
          from {{ this }} t
          left join {{ ref('WORK', 'DIM_CUSTOMER') }} c
            on t.ORDER_CUSTKEY = c.C_CUSTKEY
          where c.C_CUSTKEY is null
          group by 1
      - continueOnFailure: true
        description: ""
        name: Integrity - Referential fact → part dimension
        runOrder: After
        templateString: |-
          -- FAIL if fact part keys don't exist in DIM_PART
          select
            t.LINEITEM_PARTKEY
          from {{ this }} t
          left join {{ ref('WORK', 'DIM_PART') }} p
            on t.LINEITEM_PARTKEY = p.P_PARTKEY
          where p.P_PARTKEY is null
          group by 1
      - continueOnFailure: true
        description: ""
        name: Integrity - Referential fact → supplier dimension
        runOrder: After
        templateString: |-
          -- FAIL if fact supplier keys don't exist in DIM_SUPPLIER
          select
            t.LINEITEM_SUPPKEY
          from {{ this }} t
          left join {{ ref('WORK', 'DIM_SUPPLIER') }} s
            on t.LINEITEM_SUPPKEY = s.S_SUPPKEY
          where s.S_SUPPKEY is null
          group by 1
